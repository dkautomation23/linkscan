name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # sign the provenance
  attestations: write  # record it against the repository

jobs:
  build:
    strategy:
      # One leg failing should not hide the binaries the other two produced.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Test
        run: cargo test --locked
      - name: Name the archive after the platform it runs on
        shell: bash
        run: |
          name="${GITHUB_REPOSITORY##*/}"
          version="${GITHUB_REF_NAME}"
          staging="${name}-${version}-${{ matrix.target }}"
          mkdir "$staging"
          cp README.md LICENSE "$staging/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/${name}.exe" "$staging/"
            7z a "${staging}.zip" "$staging"
            echo "ASSET=${staging}.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/${name}" "$staging/"
            tar czf "${staging}.tar.gz" "$staging"
            echo "ASSET=${staging}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Attest that this artefact came from this workflow
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "${{ env.ASSET }}"
      - name: Attach it to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
