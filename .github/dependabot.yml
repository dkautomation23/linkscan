# Поставлено скриптом _security/rollout.py. Бесплатно.
# Следит за уязвимыми версиями подключённых библиотек и сам шлёт PR с обновлением.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
